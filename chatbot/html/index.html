<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Chatbot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="btn btn-accent" href="minichat.html" data-i18n="mini">Mini chatbot</a>
    <div class="brand">
      <span class="logo">🐍</span>
      <span data-i18n="title">Python Chatbot</span>
    </div>
    <div class="flags" role="group" aria-label="Language">
      <button class="flag" data-lang="en" title="English" aria-label="English">
        <svg viewBox="0 0 60 30" width="36" height="18"><clipPath id="uk-c"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#uk-c)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>
      </button>
      <button class="flag" data-lang="no" title="Norsk" aria-label="Norsk">
        <svg viewBox="0 0 22 16" width="25" height="18"><rect width="22" height="16" fill="#BA0C2F"/><path d="M0,8 h22 M8,0 v16" stroke="#fff" stroke-width="4"/><path d="M0,8 h22 M8,0 v16" stroke="#00205B" stroke-width="2"/></svg>
      </button>
      <button class="flag" data-lang="uk" title="Українська" aria-label="Українська">
        <svg viewBox="0 0 3 2" width="27" height="18"><rect width="3" height="1" fill="#0057B7"/><rect y="1" width="3" height="1" fill="#FFD700"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <p class="subtitle" data-i18n="subtitle">Ask anything about Python. A local language model searches its knowledge and answers.</p>

    <textarea id="input" class="input" rows="7" data-i18n-ph="placeholder"
              placeholder="Type your Python question here, e.g. What basic types are supported in Python?"></textarea>

    <div class="bar">
      <button id="btnClearIn" class="btn" data-i18n="clearIn">Clear input</button>
      <button id="btnClearOut" class="btn" data-i18n="clearOut">Clear output</button>
      <span class="spacer"></span>
      <span id="status" class="status"></span>
      <button id="btnProcess" class="btn btn-primary" data-i18n="process">Process</button>
    </div>

    <div id="output" class="output" aria-live="polite">
      <div class="placeholder" data-i18n="empty">The answers will appear here.</div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
